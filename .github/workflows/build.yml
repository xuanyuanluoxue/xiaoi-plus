name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # AGP 9.5.1 需要 JDK 21；Gradle 由 wrapper 固定为 9.9.0。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 37 / build-tools 37.0.0 与 app/build.gradle.kts 对齐。
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Read version
        id: version
        run: |
          echo "name=$(bash scripts/version.sh name)" >> "$GITHUB_OUTPUT"
          echo "code=$(bash scripts/version.sh code)" >> "$GITHUB_OUTPUT"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.version.outputs.name }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 versionName $VERSION 不一致"
            exit 1
          fi

      - name: Unit tests (JVM)
        run: |
          chmod +x tests/run.sh
          ./tests/run.sh

      - name: Consistency check
        run: |
          chmod +x scripts/check-consistency.sh
          ./scripts/check-consistency.sh

      # Gradle 在配置阶段读取签名环境变量；keystore 必须先落盘。
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 secrets.KEYSTORE_BASE64，release 产物将用临时密钥签名，仅供测试。"
            exit 0
          fi
          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::配置了 KEYSTORE_BASE64 但缺少 secrets.KEYSTORE_PASSWORD"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/xiaoi.keystore
          chmod 600 keystore/xiaoi.keystore
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # debug 不启用 R8，release 启用 R8 + shrinkResources（见 app/proguard-rules.pro）。
      - name: Build (debug + release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      # 正式签名直接复用 Gradle 产物；无密钥时用临时证书签名，保证 APK 可安装。
      - name: Package APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          V="$(bash scripts/version.sh name)"
          mkdir -p build dist
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk build/xiaoi-plus.apk
          else
            UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
            [ -f "$UNSIGNED" ] || { echo "::error::找不到 $UNSIGNED"; exit 1; }
            BT="$(ls -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"/build-tools/* | sort -V | tail -1)"
            "$BT/zipalign" -f 4 "$UNSIGNED" build/xiaoi-plus-aligned.apk
            keytool -genkeypair -keystore "$RUNNER_TEMP/temp.keystore" \
              -storepass temp-xiaoi -keypass temp-xiaoi -alias xiaoi \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=XiaoAi Plus Temp, O=OpenSource, C=CN" >/dev/null 2>&1
            KEYSTORE_FILE="$RUNNER_TEMP/temp.keystore" \
              KEYSTORE_PASSWORD=temp-xiaoi KEYSTORE_ALIAS=xiaoi \
              bash scripts/ci-sign.sh build/xiaoi-plus-aligned.apk build/xiaoi-plus.apk
          fi
          cp build/xiaoi-plus.apk "dist/xiaoi-plus-$V.apk"
          ( cd dist && sha256sum "xiaoi-plus-$V.apk" > "xiaoi-plus-$V.apk.sha256" )
          bash scripts/release-notes.sh "$V" "dist/xiaoi-plus-$V.apk" > "dist/release-notes-$V.md"
          if [ "$SIGNED" != "true" ]; then
            printf '\n> ⚠️ 本次构建未配置正式签名密钥，产物用临时密钥签名，仅供测试，不能覆盖安装正式版。\n' >> "dist/release-notes-$V.md"
          fi

      - name: Verify APK signature
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          chmod +x scripts/verify-apk.sh
          if [ "$SIGNED" = "true" ]; then
            # 正式密钥：必须命中 scripts/expected-signer.sha256，否则 tag 也不发 Release
            ./scripts/verify-apk.sh build/xiaoi-plus.apk
          else
            echo "::warning::未使用正式签名密钥，只校验已签名/包名/versionCode，跳过固定指纹比对；该产物不能发布。"
            ./scripts/verify-apk.sh build/xiaoi-plus.apk --allow-any-signer
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoi-plus-${{ steps.version.outputs.name }}
          path: |
            dist/xiaoi-plus-*.apk
            dist/xiaoi-plus-*.apk.sha256
            dist/release-notes-*.md
          if-no-files-found: error

      - name: Skip GitHub Release (unsigned build)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed != 'true'
        run: |
          echo "::warning::tag $GITHUB_REF_NAME 构建未使用正式签名密钥，已跳过 GitHub Release；artifact 仅供测试。"
          echo "::notice::恢复 secrets.KEYSTORE_* 后重新推送 tag 才会创建 Release。"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes-${{ steps.version.outputs.name }}.md
          files: |
            dist/xiaoi-plus-${{ steps.version.outputs.name }}.apk
            dist/xiaoi-plus-${{ steps.version.outputs.name }}.apk.sha256
          draft: false
          prerelease: ${{ contains(steps.version.outputs.name, '-') }}
          fail_on_unmatched_files: true

      - name: Remove decoded keystore
        if: always()
        run: rm -f keystore/xiaoi.keystore
